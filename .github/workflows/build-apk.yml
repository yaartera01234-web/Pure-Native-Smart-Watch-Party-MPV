name: "WP Native first page - build APK"

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip khol kar project banao
        run: |
          set -euo pipefail
          unzip -o WatchParty-Native-FirstPage.zip
          ls -la app/src/main/java/app/party/wpnative

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare artifact
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -name '*.apk' -type f | head -1)
          cp "$APK" WatchParty-FirstPage.apk
          sha256sum WatchParty-FirstPage.apk | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: watchparty-firstpage
          path: |
            WatchParty-FirstPage.apk
            SHA256SUMS.txt
            
