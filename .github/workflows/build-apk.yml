name: "WP Native first page - build APK"

on:
  push:
    branches: [ main, "arena/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip khol kar project banao
        run: |
          set -euo pipefail
          unzip -o WatchParty-Native-FirstPage.zip
          ls -la app/src/main/java/app/party/wpnative

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log

      # Fail ho to poora Gradle log branch par daal do (artefact download
      # har jagah se possible nahi hota — log seedha padhne ke liye).
      - name: Error log save karo
        if: failure()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@example.com"
          git checkout -B ci-logs
          cp /tmp/gradle.log gradle-error.log
          git add -f gradle-error.log
          git commit -m "gradle error log (run $GITHUB_RUN_ID)" || exit 0
          git push -f origin ci-logs

      - name: Prepare artifact
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -name '*.apk' -type f | head -1)
          cp "$APK" WatchParty-FirstPage.apk
          sha256sum WatchParty-FirstPage.apk | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: watchparty-firstpage
          path: |
            WatchParty-FirstPage.apk
            SHA256SUMS.txt
