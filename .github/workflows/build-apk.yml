name: "Smart Party Plus - build verified signing input"

on:
  push:
    branches: [ main, "arena/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip khol kar project banao
        run: |
          set -euo pipefail
          unzip -o WatchParty-Native-FirstPage.zip
          ls -la app/src/main/java/app/party/wpnative
          python3 tests/verify_launcher_manifest.py
          python3 tests/verify_room_tunes.py
          python3 tests/verify_live_identity_surfaces.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare exact Synkplay v0.23.0 native engine
        run: |
          set -euo pipefail
          exec > >(tee /tmp/engine.log) 2>&1
          # ubuntu-latest already provides Android command-line tools. Avoid the
          # deprecated setup-android Node action; install only the pinned pieces.
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'ndk;29.0.14206865' 'build-tools;35.0.0'
          python3 tests/mpv023/engine_swap.py prepare --work /tmp/mpv023
          python3 tests/mpv023/engine_swap.py build --work /tmp/mpv023 \
            --ndk "$ANDROID_HOME/ndk/29.0.14206865"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build debug base APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: Substitute exact MPV023 engine, align and verify signing input
        run: |
          set -euo pipefail
          exec > >(tee /tmp/swap.log) 2>&1
          SDK="$ANDROID_HOME/build-tools/35.0.0"
          BASE=$(find app/build/outputs/apk -name '*.apk' -type f | head -1)
          test -n "$BASE"
          KEYSTORE=/tmp/mpv023/ci-only.keystore
          keytool -genkeypair -noprompt -keystore "$KEYSTORE" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname 'CN=CI Verification Only,O=Smart Party Plus,C=SG' \
            -keyalg RSA -keysize 2048 -validity 10000
          python3 tests/mpv023/engine_swap.py swap --work /tmp/mpv023 \
            --base "$BASE" --output /tmp/mpv023/unsigned.apk
          "$SDK/zipalign" -P 16 -f 4 /tmp/mpv023/unsigned.apk SmartPartyPlus-aligned-unsigned.apk
          "$SDK/zipalign" -c -P 16 4 SmartPartyPlus-aligned-unsigned.apk
          # CI key sirf compile/engine verification ke liye hai. Public final APK Arena
          # workspace mein permanent private key se sign hoti hai; key kabhi Git mein nahi.
          "$SDK/apksigner" sign \
            --ks "$KEYSTORE" --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --out SmartPartyPlus-CI-Check.apk SmartPartyPlus-aligned-unsigned.apk
          "$SDK/apksigner" verify --verbose --print-certs SmartPartyPlus-CI-Check.apk
          "$SDK/zipalign" -c -P 16 4 SmartPartyPlus-CI-Check.apk
          python3 tests/mpv023/engine_swap.py verify --work /tmp/mpv023 \
            --base "$BASE" --output SmartPartyPlus-CI-Check.apk
          unzip -p SmartPartyPlus-CI-Check.apk lib/arm64-v8a/libmpv.so | \
            strings | grep -F 'mpv v0.41.0-252-gc401ef9c3'
          unzip -p SmartPartyPlus-CI-Check.apk lib/arm64-v8a/libavcodec.so | \
            strings | grep -F 'FFmpeg version N-123143-g0540b42657'
          sha256sum SmartPartyPlus-CI-Check.apk | tee CI-CHECK-SHA256SUMS.txt

      # Fail ho to poora Gradle log branch par daal do (artefact download
      # har jagah se possible nahi hota — log seedha padhne ke liye).
      - name: Error log save karo
        if: failure()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@example.com"
          git checkout -B ci-logs
          {
            if [ -f /tmp/engine.log ]; then echo '=== MPV023 ENGINE ==='; cat /tmp/engine.log; fi
            if [ -f /tmp/gradle.log ]; then echo '=== GRADLE ==='; cat /tmp/gradle.log; fi
            if [ -f /tmp/swap.log ]; then echo '=== APK ENGINE SWAP ==='; cat /tmp/swap.log; fi
          } > gradle-error.log
          test -s gradle-error.log || echo "Failure artifact substitution mein hui; Actions log dekhein." > gradle-error.log
          git add -f gradle-error.log
          git commit -m "gradle error log (run $GITHUB_RUN_ID)" || exit 0
          git push -f origin ci-logs

      - uses: actions/upload-artifact@v4
        with:
          name: smart-party-plus-signing-input
          path: |
            SmartPartyPlus-aligned-unsigned.apk
            SmartPartyPlus-CI-Check.apk
            CI-CHECK-SHA256SUMS.txt
            tests/mpv023/manifest.json
            tests/mpv023/README.md

      # Temporary non-secret hand-off for Arena's permanent local signing pass.
      - name: Publish aligned v1.0.7 signing input
        if: github.event_name == 'push' && startsWith(github.ref_name, 'arena/')
        run: |
          set -euo pipefail
          git config user.name "ci-bot"
          git config user.email "ci-bot@example.com"
          git add -f SmartPartyPlus-aligned-unsigned.apk
          git commit -m "Publish v1.0.7 signing input [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # Final release is deliberately NOT auto-signed here. Arena signs the aligned input with
      # the permanent private release key and publishes WatchParty-FirstPage.apk. This prevents
      # accidental future signature changes; private signing material never enters GitHub.
